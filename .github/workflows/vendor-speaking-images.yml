name: Host Speaking photographs locally
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/vendor-speaking-images.yml

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and validate licensed photographs
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, urllib.parse, urllib.request
          folder=pathlib.Path("assets/speaking")
          folder.mkdir(parents=True,exist_ok=True)
          photos={
             "classroom.jpg":"Students in classroom.jpg",
             "clinic.jpg":"Clinica de fisioterapia.jpg",
             "exercise.jpg":"Spangdahlem physical therapy rehabilitates Airmen after injury (7270862).jpg",
          }
          for destination,title in photos.items():
              url="https://commons.wikimedia.org/wiki/Special:FilePath/"+urllib.parse.quote(title)+"?width=900"
              req=urllib.request.Request(url,headers={"User-Agent":"PhysiotherapyEnglishEducationalSite/1.0 (GitHub Pages; Wikimedia Commons attribution kept)"})
              with urllib.request.urlopen(req,timeout=40) as response:
                  content=response.read()
              if len(content)<10000 or not content.startswith(bytes.fromhex("ffd8ff")):
                  raise RuntimeError("Invalid JPEG download: "+title)
              (folder/destination).write_bytes(content)
              print(destination,len(content),"bytes")
          page=pathlib.Path("index.html")
          text=page.read_text(encoding="utf-8")
          sources={
              "Students in classroom.jpg":"assets/speaking/classroom.jpg",
              "Clinica de fisioterapia.jpg":"assets/speaking/clinic.jpg",
              "Spangdahlem physical therapy rehabilitates Airmen after injury (7270862).jpg":"assets/speaking/exercise.jpg"
          }
          for title,local in sources.items():
              remote="https://commons.wikimedia.org/wiki/Special:FilePath/"+urllib.parse.quote(title)+"?width=900"
              if remote not in text:
                  raise RuntimeError("Expected source reference not found: "+title)
              text=text.replace(remote,local)
          page.write_text(text,encoding="utf-8")
          worker=pathlib.Path("service-worker.js")
          sw=worker.read_text(encoding="utf-8")
          import re
          match=re.search(r"physio-english-v(\d+)",sw)
          if match:
              sw=sw.replace(match.group(0),"physio-english-v"+str(int(match.group(1))+1))
          worker.write_text(sw,encoding="utf-8")
          PY
      - name: Commit local image assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/speaking index.html service-worker.js
          if ! git diff --cached --quiet; then
            git commit -m "Store credited Speaking images locally [skip ci]"
            git push
          fi
