name: Physio Christmas daily release
on:
  schedule:
    - cron: '17 23 30 11 *'
    - cron: '17 23 1-23 12 *'
    - cron: '17 */2 1-24 12 *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/physio-christmas-release.yml'
      - 'tools/publish_physio_christmas.py'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish only content eligible today (leave off for a test)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: physio-christmas-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Check publication credentials
        env:
          RELEASE_TOKEN: ${{ secrets.PHYSIO_CHRISTMAS_RELEASE_TOKEN }}
        run: |
          test -n "$RELEASE_TOKEN" || { echo "::error::Missing private release token"; exit 1; }
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PHYSIO_CHRISTMAS_RELEASE_TOKEN }}
          path: public-site
      - uses: actions/checkout@v4
        with:
          repository: lecomteeglantine/physio-christmas-private
          ref: main
          token: ${{ secrets.PHYSIO_CHRISTMAS_RELEASE_TOKEN }}
          path: private-source
          persist-credentials: false
      - name: Simulate all releases in memory without publishing
        run: python3 public-site/tools/publish_physio_christmas.py --master private-source/Physio_Christmas_Demo_confidentielle.html --public public-site/physio-christmas/index.html --check-all
      - name: Publish eligible content only
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        run: python3 public-site/tools/publish_physio_christmas.py --master private-source/Physio_Christmas_Demo_confidentielle.html --public public-site/physio-christmas/index.html
      - name: Commit public calendar only
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        working-directory: public-site
        run: |
          git config user.name "Physio Christmas release"
          git config user.email "actions@users.noreply.github.com"
          git add -- physio-christmas/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish eligible Christmas doors"
          git push origin HEAD:main
