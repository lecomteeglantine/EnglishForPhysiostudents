(--red);color:#fff3d9;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:.4rem;box-shadow:inset 0 0 0 3px #0001}.door:nth-child(even){background:var(--green)}.door:not(:disabled):hover{background:#6d4b2b;color:white}.door strong{font-size:2.2rem;line-height:1.1;font-weight:normal}.door span{font-size:.82rem;line-height:1.1}.door:disabled{background:#695b48;color:#fff5e4;opacity:.8}.door.done{border-color:#d8b65f}.door.final{background:#8a6c32;color:white}.paper{background:var(--cream);border:1px solid var(--gold);padding:clamp(1rem,3vw,2rem);box-shadow:0 2px 8px #47351d19}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(185px,100%),1fr));gap:.8rem;margin:1rem 0}.gallery button{padding:.45rem;background:#fdf5e3;text-align:center}.gallery img{width:100%;height:185px;object-fit:contain;display:block}.gallery span{display:block;font-size:.88rem;line-height:1.2;margin:.4rem 0}.copy{white-space:pre-line;max-width:75ch}.question{border-top:1px solid #b9a378;padding:1rem 0}.choices{display:grid;gap:.45rem}.choices button{text-align:left;white-space:normal}.choices button[aria-pressed=true]{background:#e1cba0;outline:2px solid var(--green)}.feedback{min-height:1.3em;color:var(--green);margin:.55rem 0}.actions{display:flex;gap:.5rem;flex-wrap:wrap;margin:1rem 0}.field{display:block;margin:.7rem 0}.field select,.field input,textarea{display:block;width:100%;max-width:100%;border:1px solid #b6985f;border-radius:3px;background:#fff9e9;color:#382c22;padding:.65rem}textarea{min-height:180px;resize:vertical}.muted{font-size:.92rem;color:#685a46}.suspects{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(210px,100%),1fr));gap:1rem}.suspect{border:1px solid #b6985f;padding:.7rem;background:#fdf5e3}.suspect img{width:100%;height:220px;object-fit:contain}.suspect button{width:100%}.notice{background:#f9efd8;border-left:4px solid var(--red);padding:.65rem 1rem;margin:.5rem 0 1rem}.stage{position:relative;overflow:hidden;min-height:68px;padding:1rem;text-align:center;background:#294e3d;color:#f5ead4;border:3px double #b6985f}.stage .motif{display:inline-block;font-size:2rem;margin-right:.5rem;vertical-align:middle}.stage.play .motif{animation:sway 1.3s ease-in-out 2}.stage.play:after{content:'✦  ·  ✦  ·  ✦';position:absolute;left:0;right:0;top:0;animation:fall 2s ease-out;pointer-events:none;color:#e8cc88;letter-spacing:1.1em}@keyframes sway{0%,100%{transform:rotate(0)}25%{transform:rotate(-15deg) scale(1.1)}75%{transform:rotate(15deg) scale(1.1)}}@keyframes fall{from{transform:translateY(-25px);opacity:0}to{transform:translateY(80px);opacity:1}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;scroll-behavior:auto!important}}dialog{max-width:min(94vw,900px);max-height:92vh;background:var(--cream);border:2px solid var(--gold);padding:.8rem;color:var(--ink)}dialog img{max-width:100%;max-height:70vh;object-fit:contain;display:block;margin:auto}dialog::backdrop{background:#191c18bb}footer{text-align:center;font-size:.85rem;padding:1.5rem;color:#685a46}a{color:#294e3d} [hidden]{display:none!important}@media(max-width:650px){main{padding:.65rem}.hero{grid-template-columns:1fr;padding:1rem}.hero img{max-height:235px}.calendar{grid-template-columns:repeat(4,minmax(0,1fr));gap:.4rem}.door{min-height:85px}.door strong{font-size:1.8rem}.door span{font-size:.75rem}nav button{font-size:.85rem;padding:.45rem}.suspects{grid-template-columns:repeat(2,minmax(0,1fr))}.suspect img{height:155px}.suspect{padding:.5rem}.paper{padding:.9rem}header small{font-size:.7rem}}

/* Festive motion, preserving the original painted assets */
.hero-art,.greeting-art{position:relative;overflow:hidden;isolation:isolate;background:#253d31}
.hero-art{border:3px double var(--gold)}
.hero .hero-art img{display:block;border:0;max-height:380px;width:100%;object-fit:cover}
.snow-layer{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.snow-layer i{position:absolute;top:-12px;width:var(--size);height:var(--size);border-radius:50%;background:#fff9e7;opacity:.75;animation:drift var(--dur) linear var(--delay) infinite}
@keyframes drift{0%{transform:translate(0,-12px)}100%{transform:translate(var(--drift),420px)}}
.motion-paused .snow-layer i,.motion-paused .greeting-art *{animation-play-state:paused!important}
.hero-tools{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.9rem}
.greeting-art{height:clamp(150px,30vw,260px);margin:.4rem auto .8rem;border:2px solid #b6985f;max-width:600px}
.greeting-art img{display:block;height:100%;width:100%;object-fit:contain;background:#e9dbc0}
.greeting-art.landscape img{object-fit:cover}
.greeting-art img{transform-origin:50% 80%}
.stage.play .greeting-art img{animation:card-motion 1.5s ease-in-out 2}
.stage.play .greeting-art.landscape img{animation:land-motion 3s ease-out both}
@keyframes card-motion{0%,100%{transform:rotate(0) scale(1)}35%{transform:rotate(-2deg) scale(1.035)}70%{transform:rotate(2deg) scale(1.035)}}
@keyframes land-motion{from{transform:scale(1)}to{transform:scale(1.035)}}
.greeting-art .festive-symbol{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(60px,15vw,115px);color:#e2c58b;text-shadow:2px 3px #17271d}
.stage.play .festive-symbol{animation:card-motion 1.2s ease-in-out 2}
.stage.play .greeting-art:after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 35%,#fff5d525 50%,transparent 65%);animation:card-glint 2.5s ease-out both}
@keyframes card-glint{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.stage:has(.greeting-art):after{display:none}
@media(max-width:650px){.hero .hero-art img{max-height:235px}}
@media(prefers-reduced-motion:reduce){.snow-layer{display:none}.greeting-art img{transform:none!important}}


/* Individual portrait motion, using the approved painted portraits without redrawing them. */
.greeting-art[data-motion],.suspect img{transform-origin:50% 80%}
.stage.play .greeting-art[data-motion="chuckle"] img,.portrait-speaking[data-motion="chuckle"]{animation:chuckle .62s ease-in-out 3}
.stage.play .greeting-art[data-motion="nod"] img,.portrait-speaking[data-motion="nod"]{animation:nod 1.4s ease-in-out 2}
.stage.play .greeting-art[data-motion="bounce"] img,.portrait-speaking[data-motion="bounce"]{animation:bounce .82s ease-in-out 3}
.stage.play .greeting-art[data-motion="tilt"] img,.portrait-speaking[data-motion="tilt"]{animation:tilt 1.25s ease-in-out 2}
.stage.play .greeting-art[data-motion="settle"] img,.portrait-speaking[data-motion="settle"]{animation:settle 1.4s ease-in-out 2}
.stage.play .greeting-art[data-motion="sway"] img,.portrait-speaking[data-motion="sway"]{animation:frostsway 1.5s ease-in-out 2}
.stage.play .greeting-art[data-motion="hop"] img,.portrait-speaking[data-motion="hop"]{animation:hop .7s ease-in-out 3}
.stage.play .greeting-art[data-motion="inspect"] img,.portrait-speaking[data-motion="inspect"]{animation:inspect 1.6s ease-in-out 2}
@keyframes chuckle{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px) scale(1.025)}}
@keyframes nod{0%,100%{transform:rotate(0)}45%{transform:rotate(2deg) translateY(2px)}}
@keyframes bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-5px) rotate(-1deg)}}
@keyframes tilt{0%,100%{transform:rotate(0)}45%{transform:rotate(-3deg)}}
@keyframes settle{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
@keyframes frostsway{0%,100%{transform:rotate(0)}33%{transform:rotate(-2deg)}66%{transform:rotate(2deg)}}
@keyframes hop{0%,100%{transform:translateY(0)}45%{transform:translateY(-6px)}}
@keyframes inspect{0%,100%{transform:rotate(0) scale(1)}45%{transform:rotate(1.5deg) scale(1.04)}}
.motion-paused .stage *,.motion-paused .portrait-speaking{animation-play-state:paused!important}
.suspect button{margin-top:.3rem}.audio-status{min-height:1em}

'use strict';const P=JSON.parse(document.getElementById('payload').textContent),$=id=>document.getElementById(id), main=$('main');const DAYS=new Map(P.days.map(d=>[d.day,d]));const tabs=[['calendar','Advent Calendar'],['suspects','Suspect Profiles'],['evidence','Evidence Room'],['notebook','Detective Notebook'],['accuse','Make Your Accusation']];const key='physio2412-v1-'+(P.demo?'demo':'student');let state={opened:[],pinned:[],notes:'',nickname:'',suspect:'',poll:{},accusation:null,sound:false};let storageOK=true;try{state={...state,...JSON.parse(localStorage.getItem(key)||'{}')}}catch(e){storageOK=false}function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch(e){storageOK=false}}function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}function add(parent,tag,text,cls){const n=el(tag,text,cls);parent.append(n);return n}function btn(parent,text,fn,cls){let b=add(parent,'button',text,cls);b.type='button';b.addEventListener('click',fn);return b}function notice(parent,t){add(parent,'p',t,'notice')}function section(title){let s=add(main,'section',undefined,'paper');add(s,'h2',title);return s}function pic(parent,k){if(!P.assets[k])return;let b=btn(parent,'',()=>{ $('bigImage').src=P.assets[k];$('bigImage').alt=P.captions[k];$('bigCaption').textContent=P.captions[k];$('viewer').showModal()});let im=add(b,'img');im.src=P.assets[k];im.alt=P.captions[k];im.loading='lazy';add(b,'span',P.captions[k]);return b}function gallery(parent,keys){if(!keys?.length)return;let g=add(parent,'div',undefined,'gallery');keys.forEach(k=>pic(g,k))}function localNotice(parent){add(parent,'p',storageOK?'Private to this browser and device. No information is sent to your teacher or classmates.':'Browser storage is unavailable. Your choices may be lost when you reload.','muted')}
function navigate(v,focus=true){if(location.hash.slice(1)===v)render();else location.hash=v;if(focus)main.focus({preventScroll:true})}function nav(active){$('nav').replaceChildren();tabs.forEach(([id,t])=>{let b=btn($('nav'),t,()=>navigate(id));b.setAttribute('aria-current',String(active===id))})}function soundUI(){$('sound').textContent='Sound: '+(state.sound?'on':'off');$('sound').setAttribute('aria-pressed',String(state.sound))}soundUI();$('sound').onclick=()=>{state.sound=!state.sound;save();soundUI();if(!state.sound){cancelSpeech()}else chime(1)};let audio;function chime(day){if(!state.sound)return;try{audio ||= new (window.AudioContext||window.webkitAudioContext)();audio.resume();let notes=day===24?[523,659,784,1047]:day%3===0?[523,392]:[659,784,988];notes.forEach((f,i)=>{let o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(audio.destination);let t=audio.currentTime+i*.14;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.09,t+.025);g.gain.exponentialRampToValueAtTime(.0001,t+.32);o.start(t);o.stop(t+.34)})}catch(e){}}
const voiceProfiles=[
 {name:'Santa Claus',preferred:['George','Daniel','Ryan','Arthur'],rate:.83,pitch:.72,motion:'chuckle'},
 {name:'Mrs Claus',preferred:['Susan','Hazel','Sonia','Martha'],rate:.91,pitch:1.02,motion:'nod'},
 {name:'Rudolph',preferred:['Ryan','Oliver','Daniel'],rate:1.01,pitch:1.20,motion:'bounce'},
 {name:'Dexter the Elf',preferred:['Arthur','George','Daniel'],rate:1.03,pitch:.89,motion:'tilt'},
 {name:'Dr Holly',preferred:['Sonia','Serena','Kate','Hazel'],rate:.95,pitch:1.11,motion:'settle'},
 {name:'Frosty',preferred:['Oliver','Ryan','George'],rate:.84,pitch:1.14,motion:'sway'},

const narration={preferred:['Serena','Kate','Sonia','Daniel'],rate:.95,pitch:1,motion:'settle'};
const speakerAliases={'Santa':0,'Santa Claus':0,'Mrs Claus':1,'Rudolph':2,'Dexter':3,'Dexter the Elf':3,'Dr Holly':4,'Frosty':5,'Ginger':6,'Inspector Snow':7};
function splitDialogue(text){const out=[];const rx=/(Santa Claus|Mrs Claus|Inspector Snow|Dexter the Elf|Dr Holly|Rudolph|Dexter|Frosty|Ginger|Santa):\s*“([^”]+)”/g;let end=0;for(const m of String(text).matchAll(rx)){let lead=text.slice(end,m.index).trim();if(lead)out.push({speaker:null,text:lead});out.push({speaker:speakerAliases[m[1]],text:m[2]});end=m.index+m[0].length;}let tail=text.slice(end).trim();if(tail)out.push({speaker:null,text:tail});return out;}
function pickVoice(profile,available){const uk=available.filter(v=>/^en[-_]GB$/i.test(v.lang));const english=available.filter(v=>/^en(?:[-_]|$)/i.test(v.lang));const pool=uk.length?uk:english;for(const pref of profile.preferred){const hit=pool.find(v=>v.name.toLowerCase().includes(pref.toLowerCase()));if(hit)return hit;}return pool[0]||null;}
let speakingToken=0;
function cancelSpeech(){speakingToken++;if('speechSynthesis'in window)window.speechSynthesis.cancel();document.querySelectorAll('.portrait-speaking').forEach(n=>n.classList.remove('portrait-speaking'));}
function playDialogue(parts,status,portrait){if(!('speechSynthesis'in window)||!('SpeechSynthesisUtterance'in window)){if(status)status.textContent='Spoken audio is unavailable. Please use the transcript.';return false;}if(!parts.length)return false;if(!state.sound){state.sound=true;save();soundUI()}cancelSpeech();const token=speakingToken;const synth=window.speechSynthesis;let index=0;
function next(){if(token!==speakingToken)return;if(portrait)portrait.classList.remove('portrait-speaking');if(index>=parts.length){if(status)status.textContent='Playback finished.';return;}const item=parts[index++],profile=voiceProfiles[item.speaker]||narration,u=new SpeechSynthesisUtterance(item.text);u.lang='en-GB';u.rate=profile.rate;u.pitch=profile.pitch;u.volume=.85;const v=pickVoice(profile,synth.getVoices());if(v){u.voice=v;u.lang=v.lang;}if(status)status.textContent=(item.speaker===null?'Narrator':profile.name)+' speaking · synthetic voice';if(portrait){portrait.dataset.motion=profile.motion;portrait.classList.add('portrait-speaking');}u.onend=next;u.onerror=()=>{if(token!==speakingToken)return;cancelSpeech();if(status)status.textContent='Playback interrupted. You can replay it or read the transcript.';};try{synth.speak(u)}catch(_){cancelSpeech();if(status)status.textContent='Spoken audio is unavailable. Please use the transcript.';}}
next();return true;}
function read(text,status,portrait){return playDialogue(splitDialogue(text),status,portrait);}
function playStatement(index,text,status,portrait){return playDialogue([{speaker:index,text}],status,portrait);}

function calendar(){let h=add(main,'section',undefined,'hero');let t=add(h,'div');add(t,'div','A Christmas mystery in 24 instalments','kicker');add(t,'h1','Have Yourself a Merry Little Physio Christmas');add(t,'p','The Case of the Missing Christmas List');add(t,'p','24 days. 8 suspects. One mystery. Can you solve it before Christmas?');add(t,'p',P.demo?'Teacher preview — all 24 doors available.':'Open a new door every day from 1 to 24 December 2026.','muted');let im=add(h,'img');im.src=P.assets.L08;im.alt='Illustrated Christmas Square, North Pole Village';if(P.demo)notice(main,'Confidential teacher preview. Contains the entire solution; do not share with students.');add(main,'h2','Your Advent Calendar');let grid=add(main,'div',undefined,'calendar');for(let i=1;i<=24;i++){let d=DAYS.get(i);let b=btn(grid,'',()=>navigate('day-'+i),'door'+(state.opened.includes(i)?' done':'')+(i===24?' final':''));add(b,'strong',String(i));add(b,'span',d?(state.opened.includes(i)?'Reopen':'Open'):'Locked');b.disabled=!d;b.setAttribute('aria-label',`${i} December: ${d?d.title:'locked'}`)}add(main,'p',`${state.opened.filter(i=>DAYS.has(i)).length} of ${P.days.length} available doors opened.`,'muted')}
const motifs=['❄','✦','✉','✷','❄','♬','✦','⌕','♫','♬','♫','?','✦','✉','✷','Aa','✦','⌕','❄','✧','✉','⌕','✦','★'];function question(parent,q,d,i,onAnswer){let s=add(parent,'div',undefined,'question');add(s,'h3',q[0]);let c=add(s,'div',undefined,'choices'), feedback=add(s,'p','','feedback');feedback.setAttribute('role','status');let bs=q[1].map((v,j)=>btn(c,v,()=>{bs.forEach((b,k)=>b.setAttribute('aria-pressed',String(k===j)));feedback.textContent=q[2]===null?q[3]:(j===q[2]?'Exactly. ':'Not quite. ')+q[3];if(onAnswer)onAnswer()}));bs.forEach(b=>b.setAttribute('aria-pressed','false'));btn(s,'Show explanation',()=>{feedback.textContent=q[3];if(onAnswer)onAnswer()})}
function day(d){if(!d){notice(main,'That door has not been released yet.');btn(main,'Back to calendar',()=>navigate('calendar'));return}if(!state.opened.includes(d.day)){state.opened.push(d.day);save()}let s=section(`${d.day} December — ${d.title}`);add(s,'div','North Pole case file · '+String(d.day).padStart(2,'0'),'kicker');let stage=add(s,'div',undefined,'stage play');add(stage,'span',motifs[d.day-1],'motif');add(stage,'span','Christmas greetings from the North Pole');let actions=add(s,'div',undefined,'actions');btn(actions,'Replay greeting',()=>{stage.classList.remove('play');void stage.offsetWidth;stage.classList.add('play');chime(d.day)});let audioStatus=add(s,'p','','muted audio-status');audioStatus.setAttribute('role','status');btn(actions,'Listen to the text',()=>read(d.text,audioStatus,stage.querySelector('.greeting-art')));btn(actions,'Stop voice',()=>{cancelSpeech();audioStatus.textContent='Playback stopped.'});add(s,'p',d.text,'copy');gallery(s,d.images);let shown=false;function reveal(){if(shown||!d.reveal)return;shown=true;let r=add(s,'div',undefined,'notice');add(r,'p',d.reveal.text,'copy');gallery(r,d.reveal.images)}if(d.day===1){let l=add(s,'label','Optional detective nickname','field');let inp=add(l,'input');inp.value=state.nickname;inp.maxLength=50;inp.oninput=()=>{state.nickname=inp.value;save()};localNotice(s)}if(d.day===2)btn(s,'Open the suspect dossiers',()=>navigate('suspects'),'primary');if(d.day===4)btn(s,'Pull the cracker!',()=>{chime(4);reveal()},'primary');d.questions.forEach((q,i)=>question(s,q,d.day,i,d.day===20?reveal:null));if(d.day===12){poll(s,'Would you rather…?',['Carry Santa’s sack up a hundred stairs','Persuade eight reindeer to do their rehabilitation exercises'],'rather');poll(s,'Your prime suspect so far?',P.suspects,'prime');localNotice(s)}if(d.day===23)btn(s,'Make your accusation',()=>navigate('accuse'),'primary');if(d.day===24){add(s,'h3','Case closed');if(state.accusation){let a=state.accusation;add(s,'p',`Your saved theory: ${a.join(' · ')}`)}add(s,'p','Merry Christmas, future physios! Looking after others starts with looking after yourself.')}if(d.source){let p=add(s,'p','Background reading: ','muted'),a=add(p,'a','Source');a.href=d.source;a.target='_blank';a.rel='noopener noreferrer'}if([5,7,8,9,10,13,14,17,18,19,20,21,22].includes(d.day)){let b=btn(s,state.pinned.includes(d.day)?'Pinned to your evidence':'Pin to evidence room',()=>{if(!state.pinned.includes(d.day)){state.pinned.push(d.day);save()}b.textContent='Pinned to your evidence';b.disabled=true});b.disabled=state.pinned.includes(d.day)}let bottom=add(s,'div',undefined,'actions');btn(bottom,'Back to calendar',()=>navigate('calendar'));if(DAYS.has(d.day-1))btn(bottom,'Previous door',()=>navigate('day-'+(d.day-1)));if(DAYS.has(d.day+1))btn(bottom,'Next door',()=>navigate('day-'+(d.day+1)));chime(d.day)}
function poll(s,title,options,k){add(s,'h3',title);let c=add(s,'div',undefined,'choices');let bs=options.map(v=>btn(c,v,()=>{state.poll[k]=v;save();bs.forEach((b,i)=>b.setAttribute('aria-pressed',String(options[i]===v)));msg.textContent=storageOK?'Private choice saved.':'Choice recorded for this session only.'}));bs.forEach((b,i)=>b.setAttribute('aria-pressed',String(options[i]===state.poll[k])));let msg=add(s,'p',state.poll[k]?(storageOK?'Private choice saved.':'Choice recorded for this session only.'):'','feedback');msg.setAttribute('role','status')}
function suspects(){let s=section('Suspect Profiles');if(!DAYS.has(2)){notice(s,'The dossiers will be released on 2 December.');return}add(s,'p','Initial claims are not verified alibis. Decide for yourself what the evidence means.');let g=add(s,'div',undefined,'suspects');let claims=DAYS.get(2).text.split('\n').map(line=>line.split('“')[1]?.split('”')[0]||line);P.suspects.forEach((n,i)=>{let c=add(g,'article',undefined,'suspect'),im=add(c,'img');im.src=P.assets['p'+i];im.alt=n;add(c,'h3',n);let quote=add(c,'p','“'+claims[i]+'”');quote.hidden=true;let b=btn(c,'Read statement',()=>{quote.hidden=!quote.hidden;b.textContent=quote.hidden?'Read statement':'Hide statement';b.setAttribute('aria-expanded',String(!quote.hidden))});b.setAttribute('aria-expanded','false');let status=add(c,'p','','muted audio-status');status.setAttribute('role','status');btn(c,'Listen to statement',()=>{quote.hidden=false;b.textContent='Hide statement';b.setAttribute('aria-expanded','true');playStatement(i,claims[i],status,im)});btn(c,'Stop voice',()=>{cancelSpeech();status.textContent='Playback stopped.'});let m=btn(c,state.suspect===n?'Person of interest ✓':'Mark person of interest',()=>{state.suspect=state.suspect===n?'':n;save();suspectsRefresh()});});localNotice(s)}function suspectsRefresh(){cancelSpeech();main.replaceChildren();suspects()}
function evidence(){let s=section('Evidence Room');add(s,'p','Review released evidence. Opening a door is never a condition for accessing an earlier file.');let ds=P.days.filter(d=>[5,7,8,9,10,13,14,17,18,19,20,21,22].includes(d.day));if(!ds.length)notice(s,'No evidence files have been released yet.');ds.sort((a,b)=>Number(state.pinned.includes(b.day))-Number(state.pinned.includes(a.day))||a.day-b.day);for(let d of ds){let box=add(s,'div',undefined,'question');btn(box,`${String(d.day).padStart(2,'0')} · ${d.title}${state.pinned.includes(d.day)?' · pinned':''}`,()=>navigate('day-'+d.day));}}
function notebook(){let s=section('Detective Notebook');let l=add(s,'label','My notes','field'),t=add(l,'textarea');t.value=state.notes;t.placeholder='What does not quite add up?';t.oninput=()=>{state.notes=t.value;save();status.textContent=storageOK?'Saved on this device.':'Not saved: storage unavailable.'};let status=add(s,'p','','feedback');status.setAttribute('role','status');localNotice(s);btn(s,'Export my notes',()=>{let blob=new Blob([state.notes],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-detective-notes.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)})}
function accuse(){let s=section('Make Your Accusation');notice(s,'Accusations open on 23 December.');}
function render(){cancelSpeech();main.replaceChildren();let v=location.hash.slice(1)||'calendar';nav(v.startsWith('day-')?'calendar':v);if(v.startsWith('day-'))day(DAYS.get(Number(v.slice(4))));else ({calendar,suspects,evidence,notebook,accuse}[v]||calendar)();}window.addEventListener('hashchange',render);$('closeViewer').onclick=()=>$('viewer').close();render();
</script><script>
(()=>{'use strict';
let paused=false;try{paused=localStorage.getItem(key+'-motion')==='off'}catch(_){}
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
function motionUI(){document.body.classList.toggle('motion-paused',paused);const b=document.getElementById('motionControl');if(b){b.textContent=paused?'Animation: off':'Animation: on';b.setAttribute('aria-pressed',String(!paused));}}
function snow(parent){const layer=el('div',undefined,'snow-layer');layer.setAttribute('aria-hidden','true');for(let i=0;i<24;i++){let f=add(layer,'i');f.style.left=(i*37%101)+'%';f.style.setProperty('--size',(2+i%4)+'px');f.style.setProperty('--dur',(5+i%6)+'s');f.style.setProperty('--delay',(-i*.47)+'s');f.style.setProperty('--drift',(i%2?25:-25)+'px');}parent.append(layer);}
const modes=['bells','sparkle','paper','pop','wind','wood','bells','tick','music','bells','radio','pop','paper','paper','wood','sparkle','wood','snow','music','latch','paper','fire','drum','bells'];
let ctx,bus,active=[];
function stopSound(){if(bus&&ctx){try{bus.gain.cancelScheduledValues(ctx.currentTime);bus.gain.setValueAtTime(0,ctx.currentTime)}catch(_){}}active.forEach(n=>{try{n.stop()}catch(_){}});active=[];}
function soundEffect(day){if(!state.sound)return;try{
const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;ctx=ctx||new AC();if(ctx.state==='suspended')ctx.resume().catch(()=>{});stopSound();bus=ctx.createGain();bus.gain.value=.55;bus.connect(ctx.destination);let t=ctx.currentTime+.015;
function tone(f,at,len,amp=.08,type='sine',end=f){let o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,at);o.frequency.exponentialRampToValueAtTime(Math.max(20,end),at+len);g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(amp,at+.012);g.gain.exponentialRampToValueAtTime(.0001,at+len);o.connect(g);g.connect(bus);o.start(at);o.stop(at+len+.01);active.push(o);}
function noise(at,len,amp,frequency,type='bandpass'){let n=ctx.createBufferSource(),b=ctx.createBuffer(1,Math.ceil(ctx.sampleRate*len),ctx.sampleRate),a=b.getChannelData(0);let z=0;for(let i=0;i<a.length;i++){z=(z+.15*(Math.random()*2-1))/.15e1;a[i]=z*3;}n.buffer=b;let filter=ctx.createBiquadFilter();filter.type=type;filter.frequency.value=frequency;let g=ctx.createGain();g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(amp,at+.012);g.gain.exponentialRampToValueAtTime(.0001,at+len);n.connect(filter);filter.connect(g);g.connect(bus);n.start(at);n.stop(at+len);active.push(n);}
function bell(f,at){tone(f,at,.65,.07);tone(f*2.41,at,.32,.027);tone(f*3.13,at,.18,.012);}
switch(modes[day-1]||'bells'){
case 'bells': [784,1047,880,1175].forEach((f,i)=>bell(f,t+i*.16));break;
case 'sparkle':[880,1320,1760].forEach((f,i)=>bell(f,t+i*.12));break;
case 'paper':noise(t,.22,.13,2400);noise(t+.19,.37,.09,1500);break;
case 'pop':noise(t,.16,.3,1600,'lowpass');tone(180,t,.16,.1,'triangle',55);bell(880,t+.19);break;
case 'wind':noise(t,1.5,.18,440,'lowpass');break;
case 'wood':[0,.25,.48].forEach((dt,i)=>tone(420+i*75,t+dt,.16,.13,'triangle',220));break;
case 'tick':[0,.38,.76].forEach(dt=>{tone(1100,t+dt,.045,.065,'triangle');noise(t+dt,.045,.08,3000)});break;
case 'music':[523,659,784,587,698,880].forEach((f,i)=>bell(f,t+i*.18));break;
case 'radio':noise(t,.42,.13,1100);tone(650,t+.43,.2,.07,'sine',720);noise(t+.65,.24,.08,1800);break;
case 'snow':[0,.32,.65].forEach(dt=>noise(t+dt,.23,.19,780));break;
case 'latch':tone(350,t,.12,.12,'triangle',100);noise(t+.19,.36,.14,1000);bell(660,t+.54);break;
case 'fire':[0,.13,.37,.6,.87].forEach(dt=>noise(t+dt,.1,.12,950));break;
case 'drum':[0,.12,.24,.36,.48,.6].forEach(dt=>{noise(t+dt,.1,.12,900);tone(95,t+dt,.1,.04,'triangle',60)});break;
}
}catch(_){}}
chime=soundEffect;
document.getElementById('sound').addEventListener('click',()=>{if(!state.sound)stopSound()});
window.addEventListener('hashchange',stopSound,true);
function decorate(){let hero=main.querySelector('.hero');if(hero&&!hero.querySelector('.hero-art')){let im=hero.querySelector('img');if(im){let art=el('div',undefined,'hero-art');im.replaceWith(art);art.append(im);snow(art);}let tools=add(hero.firstElementChild,'div',undefined,'hero-tools');btn(tools,'Play festive bells',()=>{if(!state.sound){state.sound=true;save();soundUI()}soundEffect(1)});btn(tools,'Hear Santa’s greeting',()=>{let status=hero.querySelector('.welcome-audio');if(!status){status=add(hero.firstElementChild,'p','','muted welcome-audio');status.setAttribute('role','status')}playStatement(0,'Ho, ho, ho! Merry Christmas, future physios! A mystery awaits you at the North Pole.',status,null)});if(!document.getElementById('motionControl')){let b=btn(document.querySelector('header'),'Animation: on',()=>{paused=!paused;try{localStorage.setItem(key+'-motion',paused?'off':'on')}catch(_){}motionUI()});b.id='motionControl';}}
let stage=main.querySelector('.stage');if(stage&&!stage.querySelector('.greeting-art')){let dayNumber=Number(location.hash.slice(5)),d=DAYS.get(dayNumber);if(d){const portrait=(d.images||[]).find(k=>/^p\d$/.test(k)&&P.assets[k]);const landscape=(d.images||[]).find(k=>/^L\d+$/.test(k)&&P.assets[k]);const choice=portrait||landscape;let art=el('div',undefined,'greeting-art'+(!portrait&&landscape?' landscape':''));if(choice){let im=add(art,'img');im.src=P.assets[choice];im.alt=P.captions[choice]||'Festive illustration';if(portrait){art.dataset.motion=voiceProfiles[Number(portrait.slice(1))]?.motion||'settle';}}else{let m=add(art,'span',motifs[dayNumber-1]||'✦','festive-symbol');m.setAttribute('aria-hidden','true');}snow(art);stage.prepend(art);}}
motionUI();}
new MutationObserver(decorate).observe(main,{childList:true,subtree:false});decorate();
})();
</script></body></html>
